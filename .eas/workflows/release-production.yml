# Production release: build both platforms, check the built artifacts for store compliance, then
# submit to TestFlight and Play internal.
#
# The CLI path in the `release-app` skill is the primary, hand-verifiable route. This workflow
# is the same steps run on EAS instead of a laptop, which is what stops the release depending
# on one person's machine and one person's Xcode.
#
# NOT YET RUN. The job shapes mirror .eas/workflows/e2e.yml, but nobody has executed this
# against EAS from this repo — the first run is its own verification. Validate before trusting:
#   eas workflow:validate .eas/workflows/release-production.yml
#   eas workflow:run .eas/workflows/release-production.yml
#
# Prerequisites, once per project:
#   1. eas init                     — creates the EAS project, writes extra.eas.projectId
#   2. eas update:configure         — writes expo.updates.url so channels resolve
#   3. eas credentials              — Apple and Google signing, held by EAS not a laptop
#   4. Fill the submit profile in eas.json with ascAppId / appleTeamId / the Play service
#      account, or let the first `eas submit` prompt for them and write them back.

name: release-production

on:
  # Releases are cut deliberately from a tag, never on a push to main. The tag is the record
  # of what shipped, and `versioning` step 6 is what creates it.
  push:
    tags: ["v*"]

jobs:
  build_ios:
    type: build
    params:
      platform: ios
      profile: production

  build_android:
    type: build
    params:
      platform: android
      profile: production

  # ---------------------------------------------------------------- compliance
  #
  # The last gate before the stores. These scan the artifacts the production builds above ALREADY
  # produced — `eas/download_build` fetches them by build_id, so nothing is rebuilt.
  #
  # Why the built artifact and not just the source: this is a CNG project, so /ios and /android are
  # generated by prebuild and gitignored. The PrivacyInfo.xcprivacy that Apple reads does not exist
  # in the repo at all, and Android permissions contributed by library manifests only appear once
  # the build merges them. .github/workflows/compliance.yml scans the source on every PR and
  # structurally cannot see either. Both gates are needed; neither is sufficient.
  #
  # These enforce with --exit-code, unlike the PR job which is report-only: they run only on a
  # deliberate v* tag, and submitting with a placeholder privacy URL or an undeclared required-reason
  # API is the exact failure this exists to prevent. `--exit-code` fails on CRITICAL and HIGH, and
  # on a scanner that crashed, so an incomplete scan never reads as a pass.
  #
  # A pass here means no CRITICAL or HIGH findings in a static scan. It does NOT mean Apple or
  # Google will approve the release — see .claude/skills/greenlight/SKILL.md.
  compliance_ios:
    needs: [build_ios]
    steps:
      # preflight reads app.json and store.config.json as well as the binary, so the project has
      # to be here, not just the .ipa.
      - uses: eas/checkout

      - uses: eas/download_build
        id: ipa
        with:
          build_id: ${{ needs.build_ios.outputs.build_id }}
          extensions: [ipa]

      # Install and scan in one step so PATH survives between the two. The version is pinned in
      # .greenlight-version and the download is checksum-verified; the script picks the right
      # archive for whichever OS and architecture this runner turns out to be.
      - name: App Store compliance against the built IPA
        run: |
          GREENLIGHT_BIN="$(node .claude/scripts/install-greenlight.mjs)"
          if [ -n "$GREENLIGHT_BIN" ]; then export PATH="$GREENLIGHT_BIN:$PATH"; fi
          greenlight version
          greenlight preflight . --ipa "${{ steps.ipa.outputs.artifact_path }}" --exit-code

  compliance_android:
    needs: [build_android]
    steps:
      - uses: eas/checkout

      # The production profile builds an app-bundle, so the artifact is a .aab.
      - uses: eas/download_build
        id: aab
        with:
          build_id: ${{ needs.build_android.outputs.build_id }}
          extensions: [aab]

      # An .aab carries the MERGED manifest, which is the whole point of scanning it — a source
      # scan sees only the pre-merge manifest in the repo. It also covers Play's target API level
      # and Play Billing deadlines, 16 KB page alignment, and the 64-bit requirement.
      - name: Google Play compliance against the built AAB
        run: |
          GREENLIGHT_BIN="$(node .claude/scripts/install-greenlight.mjs)"
          if [ -n "$GREENLIGHT_BIN" ]; then export PATH="$GREENLIGHT_BIN:$PATH"; fi
          greenlight version
          greenlight preflight . --aab "${{ steps.aab.outputs.artifact_path }}" --exit-code

  # ---------------------------------------------------------------- submit
  #
  # TestFlight. Submission is a separate job so a failed submit does not discard a good build —
  # the binary stays on EAS and can be resubmitted without rebuilding. It now also waits on the
  # compliance gate, so a non-compliant binary is never handed to App Store Connect.
  submit_ios:
    needs: [build_ios, compliance_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production

  submit_android:
    needs: [build_android, compliance_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production
