name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so a vulnerability disclosed after a PR merged is still found. A scan is a
    # statement about a moment; the code and the advisory database both move on.
    - cron: "0 4 * * 1"

permissions:
  contents: read
  security-events: write # required to upload SARIF to the Security tab

jobs:
  # ---------------------------------------------------------------- Semgrep
  # The main SAST layer: fast, free, and where this repo's own rules live.
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep # semgrep is a Python tool; the container avoids installing it
    steps:
      - uses: actions/checkout@v7

      - name: Custom rules behave as specified
        run: |
          apk add --no-cache nodejs || true
          node .claude/scripts/semgrep-test.mjs

      # Two passes, because `--error` exits non-zero on ANY finding, not only on ERROR
      # ones — so the single `--error` run this replaces made every WARNING block the
      # PR, contradicting the policy stated below. First pass reports; second decides.
      #
      # `.semgrep-tests/` is excluded from both. Those fixtures are deliberately full of
      # insecure patterns so the rules in .semgrep.yml can be asserted against them, and
      # scanning them contributed 11 self-inflicted ERROR findings. The step above runs
      # them on purpose, which is the only place they belong.
      - name: Scan (reports every severity to the Security tab)
        run: |
          semgrep scan \
            --config .semgrep.yml \
            --config p/typescript \
            --config p/react \
            --config p/secrets \
            --config p/owasp-top-ten \
            --exclude .semgrep-tests \
            --sarif --output semgrep.sarif

      # The gate: an ERROR-severity finding fails the PR. Lower severities are uploaded
      # by the step above and stay visible in the Security tab without blocking.
      - name: Fail on an ERROR-severity finding
        run: |
          semgrep scan \
            --config .semgrep.yml \
            --config p/typescript \
            --config p/react \
            --config p/secrets \
            --config p/owasp-top-ten \
            --exclude .semgrep-tests \
            --severity ERROR \
            --error

      - uses: github/codeql-action/upload-sarif@v4
        if: ${{ !cancelled() }}
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ---------------------------------------------------------------- CodeQL
  #
  # COST NOTE: CodeQL is free on public repositories. On a PRIVATE repository it requires
  # GitHub Code Security (~$30/active committer/month, ~$49 under Enterprise). If this repo
  # is private and that is not budgeted, delete this job — Semgrep plus the ESLint security
  # plugins cover most of the same ground. Do not leave it failing; a red check nobody can
  # fix is a check everybody learns to ignore.
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # security-extended adds lower-severity rules; security-and-quality adds
          # maintainability ones that overlap ESLint and mostly generate noise here.
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: codeql

  # ---------------------------------------------------------------- secrets
  # A secret in git history is not removed by deleting the line — it must be rotated.
  # Finding it before merge is the only cheap moment.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------- dependencies
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Audit
        run: npm audit --audit-level=high

      # Expo pins native module versions to the SDK. A dependency bump that satisfies npm
      # audit but breaks SDK compatibility is its own kind of production incident.
      - name: SDK compatibility
        if: ${{ !cancelled() }}
        run: npx expo-doctor
