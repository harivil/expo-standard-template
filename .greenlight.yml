# Greenlight configuration — see .claude/skills/greenlight/SKILL.md
#
# This file carries `ignore:` entries and NOTHING ELSE. No rule is disabled here and no severity
# is downgraded. A compliance gate made green by editing the gate protects nothing, and the next
# person believes it. If a real finding is inconvenient, fix it or record why it cannot be fixed —
# do not add it here.
#
# Every entry below is a directory that is either generated build output or a deliberate test
# fixture, and each one was added only after the first real scan proved it was producing findings.

ignore:
  # Semgrep rule fixtures. These files contain planted credentials, plaintext http:// URLs and
  # hardcoded IPs ON PURPOSE — .claude/scripts/semgrep-test.mjs asserts that the rules in
  # .semgrep.yml fire on them. The first preflight reported three findings sourced from here
  # (§5.1.1 User Defaults, §1.6 insecure HTTP, §2.5 hardcoded IPv4) plus an INFO on the fixture's
  # own app.json. security.yml already excludes this directory from Semgrep for the identical
  # reason: a scanner that cries wolf on its own test data teaches everyone to ignore it.
  - .semgrep-tests

  # Jest coverage output. Gitignored, zero tracked files, regenerated by every `npm test`. The
  # first preflight raised a §5.1.1 "account creation without account deletion" finding whose only
  # evidence was a minified line in coverage/lcov-report/prettify.js — a vendored syntax
  # highlighter. The underlying §5.1.1 question about this app's auth is real and is tracked as a
  # product decision; a match in generated coverage HTML is not evidence for it either way.
  - coverage

  # Native projects, generated by `expo prebuild`. Gitignored, zero tracked files, and blocked
  # from hand edits by guard-write — AGENTS.md and REVIEW.md both already treat them as
  # non-findings. They exist only on a machine that has run a local build, so scanning them makes
  # a developer's findings differ from CI's for reasons that have nothing to do with the code.
  #
  # Measured, not assumed: `ignore:` applies to CODESCAN only. Re-scanning with these entries in
  # place still reported the two playscan findings under android/, so these lines are not what
  # silences those. What silences them is a clean checkout: android/ has zero tracked files, so it
  # does not exist in CI at all — those findings appear only on a machine that has run a local
  # build, and both came from a *debug* merged manifest under android/app/build/intermediates/
  # rather than from anything this repo ships.
  #
  # None of this drops Android coverage. The authoritative Android scan is the merged manifest
  # inside the built .aab, gated in .eas/workflows/release-production.yml — strictly better than a
  # pre-merge source scan, because it sees permissions contributed by library manifests.
  - android
  - ios
